name: Upload Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attach fluxe-card.js to Release
        uses: softprops/action-gh-release@v2
        with:
          files: fluxe-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
